[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nlcsplit"
version = "0.1.0"
description = "按片段归属分解 VV10/rVV10 非局域关联能（PySCF 后端，显式成对双重和）"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["DFT", "VV10", "nonlocal correlation", "fragment decomposition", "pyscf"]
authors = [{ name = "Angran Xia" }]
dependencies = [
    "numpy>=1.22",
    "pyscf>=2.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["nlcsplit", "nlcsplit.tests", "nlcsplit.examples"]

[tool.setuptools.exclude-package-data]
nlcsplit = ["logs/*", "*.out", "*.pyc", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["nlcsplit/tests"]
addopts = "-ra"
markers = [
    "slow: 需要跑自洽场与 O(N^2) 双重和的回归测试（deselect with -m 'not slow'）",
]
