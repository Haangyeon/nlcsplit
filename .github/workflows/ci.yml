name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 每个值都得是 pip 能吃的完整 specifier。原来写的 ["2.12.1", ">=2.13"] 会和下面
      # 的 "pyscf==${{ matrix.pyscf }}" 拼成 `pyscf==>=2.13`，那是无效 requirement，
      # 这个 workflow 从没跑过（本机没有远端），所以这个错一直没被暴露。
      matrix:
        pyscf: ["2.12.1", "2.14.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pyscf==${{ matrix.pyscf }}" numpy pytest
      - run: python -m pip install .
      - run: python -m pytest -q -m "not slow"
      - run: python -m pytest -q            # 含 slow：与 PySCF 原生核对照 + 几何护栏
      # 树外再跑一遍：验的是"发布出去的包"而不是工作目录，缺文件在这里才会露出来。
      - run: python -m pytest -q --pyargs nlcsplit -p no:cacheprovider
        working-directory: /tmp
      # 发布闸门 A–E：无 GAMESS 源码工件 / 无密钥与内网串 / 证据哈希 / 引用可达 / 依赖声明。
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node tools/make_public_repo.js
