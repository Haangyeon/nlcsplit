name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 每个值都得是 pip 能吃的完整 specifier。原来写的 ["2.12.1", ">=2.13"] 会和下面
      # 的 "pyscf==${{ matrix.pyscf }}" 拼成 `pyscf==>=2.13`，那是无效 requirement，
      # 这个 workflow 从没跑过（本机没有远端），所以这个错一直没被暴露。
      matrix:
        pyscf: ["2.12.1", "2.14.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pyscf==${{ matrix.pyscf }}" numpy pytest
      - run: python -m pip install .
      - run: python -m pytest -q -m "not slow"
      - run: python -m pytest -q            # 含 slow：与 PySCF 原生核对照 + 几何护栏
      # 树外再跑一遍：验的是"发布出去的包"而不是工作目录，缺文件在这里才会露出来。
      - run: python -m pytest -q --pyargs nlcsplit -p no:cacheprovider
        working-directory: /tmp
      # 发布闸门 R A B C C2 D E F G T U（十一条，exit!=0 就不出货）：
      # R 发布树残留机器路径/账号 / A 无 GAMESS 源码工件 / B 无内网串 / C 证据哈希双向闭合 /
      # C2 脱敏未动数字且母仓每份证据都登记过 / D 引用可达 / E 外部依赖已声明 /
      # F wheel 与 sdist 成员清单 / G LICENSE 署名在源文件里 / T 导出清单完整 /
      # U 包内 import 的兄弟模块真的随包发出去了（这条自检没响 = 恒真 = 不出货）
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: node tools/make_public_repo.js
